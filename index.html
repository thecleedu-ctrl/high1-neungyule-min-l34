:root {
  --bg: #eef1f6; --card: #ffffff; --ink: #141a2a; --muted: #5b6478; --line: #d5dae5; --soft: #f3f5f9;
  --ok: #17794a; --ok-bg: #e2f4ea; --bad: #b3261e; --bad-bg: #fbe6e4; --mark: #ffe680; --gold: #f2c14e;
  --bk: #1d4e89; --bk-ink: #ffffff; --bk-soft: #e4ecf7;
  --sans: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --display: 'Fraunces', 'Noto Serif KR', Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131c; --card: #1a202d; --ink: #e9edf6; --muted: #9da7bb; --line: #2f384a; --soft: #222a39;
    --ok: #6fd6a0; --ok-bg: #173327; --bad: #ff9a92; --bad-bg: #3a1c1a; --mark: #6b5a12; --gold: #f2c14e;
    --bk-soft: #24304a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131c; --card: #1a202d; --ink: #e9edf6; --muted: #9da7bb; --line: #2f384a; --soft: #222a39;
  --ok: #6fd6a0; --ok-bg: #173327; --bad: #ff9a92; --bad-bg: #3a1c1a; --mark: #6b5a12; --gold: #f2c14e;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--bk); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 0 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
b.kw { color: var(--bk); font-weight: 700; }
mark { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 1px; }
s { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }

/* 막대 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--card); border-bottom: 1px solid var(--line); }
.bar > div { max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 10px; min-height: 52px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar .back { border: 1px solid var(--line); background: var(--soft); border-radius: 999px; min-height: 40px; padding: 0 14px 0 10px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.bar .ttl { min-width: 0; font-weight: 900; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .ttl small { font-weight: 500; color: var(--muted); font-size: 12.5px; margin-left: 6px; }

  const BF = '<svg viewBox="0 0 220 220" aria-hidden="true"><path d="M18 206 C 60 196, 78 168, 96 138" fill="none" stroke="#f2c14e" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 9"/><g transform="rotate(-16 120 104)"><path d="M118 104 C 92 46, 34 34, 36 84 C 38 116, 88 120, 118 104 Z" fill="var(--tint)"/><path d="M122 104 C 148 46, 206 34, 204 84 C 202 116, 152 120, 122 104 Z" fill="var(--tint)"/><path d="M118 108 C 94 116, 62 128, 70 160 C 78 184, 110 154, 118 116 Z" fill="#f2c14e"/><path d="M122 108 C 146 116, 178 128, 170 160 C 162 184, 130 154, 122 116 Z" fill="#f2c14e"/><rect x="116.5" y="80" width="7" height="54" rx="3.5" fill="#fff"/><path d="M118 82 C 112 66, 104 60, 96 58 M122 82 C 128 66, 136 60, 144 58" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></g></svg>';

  // ── 책갈피 — 본문 문장 · 문법 연습 · 기출형 문항에 붙이고, 첫 화면에서 모아 보고, 눌러 그 자리로 간다
  const bmSvg = on => `<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 2.5h10v15l-5-3.6-5 3.6z" ${on ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"'}/></svg>`;
  const bmBtn = k => `<button class="bmk${S.bm[k] ? ' on' : ''}" data-bm="${k}" aria-pressed="${S.bm[k] ? 'true' : 'false'}" aria-label="책갈피">${bmSvg(!!S.bm[k])}</button>`;
  const plain = h => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); };
  let pend = null;
  function toggleBm(k) {
    if (S.bm[k]) delete S.bm[k]; else S.bm[k] = Date.now();
    save();
    document.querySelectorAll('[data-bm]').forEach(e => { if (e.dataset.bm === k) { const on = !!S.bm[k]; e.classList.toggle('on', on); e.setAttribute('aria-pressed', on ? 'true' : 'false'); e.innerHTML = bmSvg(on); } });
    if (k.startsWith('r|')) { const el = app.querySelector(`[data-rs="${k.slice(2)}"]`); if (el) el.classList.toggle('bm', !!S.bm[k]); }
  }
  function bmInfo(k) {                 // 책갈피 한 줄 — {book, label, text} · 내용이 바뀌어 못 찾으면 null
    const p = k.split('|');
    if (p[0] === 'r') { const R = DATA.find(b => b.kind === 'read'), c = p[1].lastIndexOf('-'), L = R && R.lessons.find(x => x.no === p[1].slice(0, c)), s = L && L.sents[+p[1].slice(c + 1)]; return s ? { book: 'read', label: `본문 읽기 · ${L.no}과 ${s.no}번`, text: plain(s.en) } : null; }
    if (p[0] === 'g') { const [l, ci, ii] = p[1].split('-'), L = G.lessons.find(x => x.no === l), c = L && L.concepts[+ci], it = c && c.items[+ii]; return it ? { book: 'grammar', label: `문법 연습 · ${l}과 ${c.mark}-${+ii + 1}`, text: plain(it.pre + '(' + it.opts.join(' / ') + ')' + it.post) } : null; }
    if (p[0] === 'q') { const b = book(p[1]), x = b && b.blocks.find(y => y.k === 'q' && String(y.no) === p[2]); return x ? { book: b.id, label: `${b.title} · ${x.lab || String(x.no).padStart(2, '0')}번`, text: plain(x.stem) } : null; }
    return null;
  }
  function jump(k) {                   // 책갈피로 간다 — 닫힌 문법 카드는 열어서 그린다
    const p = k.split('|'), info = bmInfo(k); if (!info) return;
    if (p[0] === 'g') { const [l, ci] = p[1].split('-'); S.show[`c-${l}-${ci}`] = 1; save(); }
    pend = k; go(info.book);
  }
  function arrive() {                  // 이동 직후 그 자리로 스크롤하고 잠깐 밝힌다
    if (!pend) return; const k = pend; pend = null; const p = k.split('|');
    const el = p[0] === 'r' ? app.querySelector(`[data-rs="${p[1]}"]`) : document.getElementById(p[0] === 'g' ? 'pi-' + p[1] : 'q' + p[2]);
    if (!el) return;
    el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2400);
  }
  const book = id => DATA.find(b => b.id === id);
  const qs = b => b.blocks.filter(x => x.k === 'q');
  const mc = b => qs(b).filter(q => !q.essay);
  const score = b => Math.round(mc(b).reduce((s, q) => s + ((S.a[b.id] || {})[q.no] === q.ans ? q.pts : 0), 0) * 10) / 10;   // 소수 배점(2.9점 등)의 덧셈 오차를 걷는다
  const gDone = () => Object.keys(S.g).length;
  const gTotal = G.lessons.reduce((s, l) => s + l.concepts.reduce((t, c) => t + c.items.length, 0), 0);

  function home() {
    document.documentElement.style.setProperty('--bk', '#1d4e89');
    back.hidden = true; dock.hidden = true;
    ttl.innerHTML = `${META.academy || META.grade + ' 영어'} <small>${META.academy ? META.grade + ' 영어 ' : ''}${META.lessons}</small>`;
    const cards = DATA.map(b => {
      const c = b.color, t = b.tint;
      let st = '';
      if (b.kind === 'concept') { if (gDone()) st = `연습 ${gDone()} / ${gTotal} 풂`; }
      else if (b.kind === 'read') st = '';
      else if (b.kind === 'vocab') { const n = Object.keys(S.w).length; if (n) st = `★ ${n}개 모음`; }
      else if (S.graded[b.id]) st = `${score(b)} / ${b.total}점`;
      else { const n = Object.keys(S.a[b.id] || {}).length; if (n) st = `${n} / ${mc(b).length} 답함`; }
      return `<button class="cover" data-go="${b.id}" style="--bk:${c};--tint:${t}">${BF}<div class="w">${b.word}</div><div class="t">${b.title}<span class="ar" aria-hidden="true">›</span></div><div class="d">${b.desc}</div>${st ? `<span class="st">${st}</span>` : ''}</button>`;
    }).join('') + (META.lectures || []).map((L, i) => `<div class="lecwrap"><button class="cover" data-lec="${i}" style="--bk:#6d3fb0;--tint:#f1eafb">${BF}<div class="w">LESSON</div><div class="t">${L.title}<span class="ar" aria-hidden="true">›</span></div><div class="d">${L.sub || ''}${L.mb ? ' · 게임·퀴즈 수업 ' + L.mb + 'MB(와이파이 권장)' : ''}</div></button>${(window.__yt || {})[i] ? `<a class="lecyt" href="https://youtu.be/${window.__yt[i]}" target="_blank" rel="noopener">▶ 영상으로 보기 (유튜브 · 바로 재생)</a>` : ''}</div>`).join('');
    const coin = META.logo ? '<div class="coin" aria-hidden="true"><div class="sp"><i style="--z:-4px"></i><i style="--z:-3px"></i><i style="--z:-2px"></i><i style="--z:-1px"></i><i style="--z:0px"></i><i style="--z:1px"></i><i style="--z:2px"></i><i style="--z:3px"></i><i style="--z:4px"></i><b class="f"></b><b class="f bk"></b></div></div>' : '';
    const credit = [META.academy ? `<b>${META.academy}</b>` : '', META.site ? `<a href="https://${META.site}" target="_blank" rel="noopener">${META.site}</a>` : ''].filter(Boolean).join(' · ');
    const bms = Object.keys(S.bm).sort((a, b) => S.bm[b] - S.bm[a]).map(k => [k, bmInfo(k)]).filter(x => x[1]);
    const bmHtml = bms.length ? `<section class="bms"><h2>${bmSvg(true)}책갈피 <small>${bms.length}개</small></h2>${bms.map(([k, i]) => `<div class="bmi"><button class="bmr" data-bgo="${k}"><b>${i.label}</b><span>${i.text}</span></button><button class="bmx" data-bdel="${k}" aria-label="책갈피 지우기">✕</button></div>`).join('')}</section>` : '';
    app.innerHTML = `<section class="hero${META.logo ? '' : ' nologo'}">${coin}<div class="k">${[META.academy, META.textbook + ' ' + META.grade + ' 영어'].filter(Boolean).join(' · ')}</div><h1>${META.lessons} ${META.term}</h1><p>${META.lead}</p>${META.tb ? `<div class="tbk"><b></b><span>이 교과서로 공부해요<small>${META.textbook} ${META.grade} 영어</small></span></div>` : ''}</section><div class="shelf">${cards}</div>${bmHtml}<p class="credit">${credit}${credit && META.maker ? '<br>' : ''}${META.maker ? '만든 곳 ' + META.maker : ''}</p>`;
  }

  function practice(l, ci, ii, it) {
    const k = `${l}-${ci}-${ii}`, pick = S.g[k];
    const ops = it.opts.map((o, i) => {
      let cls = 'op';
      if (pick !== undefined) cls += i === it.ans ? ' ok' : (i === pick ? ' bad' : '');
      return `<button class="${cls}" data-g="${k}" data-i="${i}"${pick !== undefined ? ' disabled' : ''}>${o}</button>`;
    }).join(' ');
    const sol = pick === undefined ? '' : `<div class="sol"><b class="${pick === it.ans ? 'o' : 'x'}">${pick === it.ans ? '맞았어요' : '다시 볼 곳'}</b> · ${it.sol}</div>`;
    return `<div class="pi" id="pi-${k}">${bmBtn('g|' + k)}<div class="q"><i>${ii + 1}</i>${it.pre}${ops}${it.post}</div>${sol}</div>`;
  }

  function grammar(b) {
    const jump = b.lessons.map(l => `<a href="#" data-jump="L${l.no}">Lesson ${l.no}</a>${l.reading ? `<a href="#" data-jump="R${l.no}">${l.no}과 본문</a>` : ''}`).join('');
    const body = b.lessons.map(l => {
      const cs = l.concepts.map((c, ci) => {
        const done = c.items.filter((_, ii) => S.g[`${l.no}-${ci}-${ii}`] !== undefined).length;
        const subs = c.subs.map(s => `<div class="sub"><h4><i>${s.no}</i>${s.title}</h4>${s.lines.map(x => `<p>${x}</p>`).join('')}${s.table ? `<div class="tw"><table class="t"><tr>${s.table.head.map(h => `<th>${h}</th>`).join('')}</tr>${s.table.rows.map(r => `<tr>${r.map((x, i) => i ? `<td>${x}</td>` : `<th>${x}</th>`).join('')}</tr>`).join('')}</table></div>` : ''}${s.ex.map(e => `<div class="ex"><div class="en">${e.en}</div>${e.ko ? `<div class="ko">${e.ko}</div>` : ''}</div>`).join('')}${s.note ? `<div class="note">${s.note}</div>` : ''}</div>`).join('');
        const open = S.show[`c-${l.no}-${ci}`] ? ' open' : '';
        return `<details class="c" data-d="c-${l.no}-${ci}"${open}><summary><em>${c.mark}</em><b>${c.name}</b><u>${done} / ${c.items.length}</u></summary><div class="cb">${subs}<div class="ph"><span>바로 확인</span><span>알맞은 것을 누르세요</span></div>${c.items.map((it, ii) => practice(l.no, ci, ii, it)).join('')}</div></details>`;
      }).join('');
      const r = l.reading, allKo = S.ko[`all-${l.no}`];
      const rd = !r ? '' : `<details class="c" id="R${l.no}" data-d="r-${l.no}"${S.show[`r-${l.no}`] ? ' open' : ''}><summary><em>R</em><b>${l.no}과 본문 주석</b><u>${r.sents.length}문장</u></summary><div class="cb"><div class="ph"><span>${r.ko}</span><button class="tg" data-allko="${l.no}">${allKo ? '해석 숨기기' : '해석 모두 보기'}</button></div>${r.sents.map(s => `<div class="sn"><i>${s.no}</i><div><div class="en">${s.en}</div><div class="nt">${s.notes.map(n => `<span>${n}</span>`).join('')}</div>${allKo || S.ko[`${l.no}-${s.no}`] ? `<div class="ko">${s.ko}</div>` : `<button class="tg" style="margin-top:7px" data-ko="${l.no}-${s.no}">해석 보기</button>`}</div></div>`).join('')}</div></details>`;
      return `<div class="lh" id="L${l.no}"><i>${l.no}</i><div><b>${l.title}</b><span>${l.ko}</span></div></div>${cs}${rd}`;
    }).join('');
    app.innerHTML = `<nav class="jump">${jump}</nav>${body}`;
    dock.hidden = true;
  }

  function exam(b) {
    const A = S.a[b.id] || {}, graded = !!S.graded[b.id];
    const body = b.blocks.map(x => {
      if (x.k === 'set') return `<div class="set"><u>${x.label}</u>${x.text}</div>`;
      const pick = A[x.no];
      let inner = `<div class="hd"><i${x.essay && x.lab ? ' class="k"' : ''}>${x.lab || String(x.no).padStart(2, '0')}</i><b>${x.stem}<small>[${x.pts}점]</small></b></div>`;
      if (x.intro) inner += `<div class="bx">${x.intro}</div>`;
      if (x.passage) inner += `<div class="bx">${x.passage}</div>`;
      (x.parts || []).forEach(p => { inner += `<div class="bx"><b class="kw">${p[0]}</b> ${p[1]}</div>`; });
      if (x.box) inner += `<div class="bx">${x.box}</div>`;
      if (x.ref) inner += `<details class="rf"><summary>${x.ref_label}</summary><div class="bx">${x.ref}</div></details>`;
      if (x.cond.length) inner += `<div class="cd"><b>&lt;조건&gt;</b>${x.cond.map(c => `<span>${c}</span>`).join('')}</div>`;
      if (x.essay) {
        const shown = graded || S.show[`${b.id}-${x.no}`];
        inner += `<textarea id="es-${b.id}-${x.no}" data-es="${x.no}" placeholder="여기에 답을 써 보세요" aria-label="${x.no}번 답">${((S.e[b.id] || {})[x.no] || '').replace(/</g, '&lt;')}</textarea>`;
        inner += shown ? `<div class="xp"><span class="v">모범답안</span>${x.model.map(m => `<div class="m">${m}</div>`).join('')}${x.allow.length ? `<p class="r">허용답안 · ${x.allow.join(' / ')}</p>` : ''}<p>${x.basis}</p>${x.rubric ? `<p class="r">채점 · ${x.rubric}</p>` : ''}</div>`
          : `<button class="tg" style="margin-top:9px" data-model="${x.no}">모범답안 보기</button>`;
      } else {
        inner += `<div class="chs${x.row ? ' row' : ''}">` + x.choices.map((c, i) => {
          let cls = 'ch';
          if (graded) cls += i === x.ans ? ' ok' : (i === pick ? ' bad' : '');
          else if (i === pick) cls += ' sel';
          return `<button class="${cls}" data-q="${x.no}" data-i="${i}"${graded ? ' disabled' : ''}><i>${CIRC[i]}</i><span>${c}</span></button>`;
        }).join('') + '</div>';
        if (graded) {
          const ok = pick === x.ans;
          inner += `<div class="xp"><span class="v ${ok ? 'o' : 'x'}">${ok ? '맞았어요' : (pick === undefined ? '풀지 않았어요' : '틀렸어요')} · 정답 ${CIRC[x.ans]}</span><p>${x.basis}</p>${x.wrong.map(w => `<p class="w">${w[0]} ${w[1]}</p>`).join('')}</div>`;
        }
      }
      return `<article class="qc" id="q${x.no}">${bmBtn('q|' + b.id + '|' + x.no)}${inner}</article>`;
    }).join('');
    let top = `<p class="intro">${b.desc}. 보기를 눌러 답을 고른 뒤 아래 「채점하기」를 누르세요. 풀던 답은 이 폰에 저장됩니다.</p>`;
    if (graded) {
      const dots = qs(b).map(q => `<a href="#" data-jq="${q.no}" class="${q.essay ? 'e' : (A[q.no] === q.ans ? 'o' : 'x')}">${q.lab || q.no}</a>`).join('');
      top = `<section class="sc"><div class="n">${score(b)}<small>/ ${b.total}점</small></div><p>선택형 ${mc(b).length}문항 가운데 ${mc(b).filter(q => A[q.no] === q.ans).length}문항 정답${b.essay_pts ? ` · 서답형 ${b.essay_pts}점은 모범답안과 견주어 스스로 채점하세요` : ''}.</p><div class="dots">${dots}</div></section>`;
    }
    app.innerHTML = top + body;
    drawDock(b);
  }

  // ── 본문 읽기 · 단어장 — 소리는 폰에 든 영어 음성으로 읽는다(브라우저가 못 하면 단추를 감춘다) ──
  const TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
  const RATES = [[0.9, '보통'], [0.7, '느리게'], [1.1, '빠르게']];
  const SPK = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/><path d="M13 7a4 4 0 0 1 0 6M15.2 4.8a7 7 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
  const SND = META.audio || TTS;                 // 녹음한 소리가 있으면 그것을, 없으면 폰의 음성을 쓴다
  const aud = META.audio ? new Audio() : null;   // 하나를 돌려 쓴다 — 아이폰은 새로 만든 소리를 손가락 없이 못 튼다
  let sayTk = 0;
  const hush = () => { sayTk++; if (aud) aud.pause(); if (TTS) speechSynthesis.cancel(); };
  function say(text, done, a) {
    const tk = ++sayTk, fin = () => { if (tk === sayTk && done) done(); };
    if (aud && a) { aud.pause(); aud.onended = aud.onerror = fin; aud.src = 'audio/' + a + '.mp3'; aud.playbackRate = (RATES[S.rate || 0] || RATES[0])[0] / 0.9; const p = aud.play(); if (p && p.catch) p.catch(fin); return; }
    if (!TTS) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/~/g, ' ')); u.lang = 'en-US'; u.rate = (RATES[S.rate || 0] || RATES[0])[0];
    u.onend = u.onerror = fin;
    speechSynthesis.speak(u);
  }

  function reading(b) {
    const ko = !!S.rko;
    const body = b.lessons.map(l => {
      const ps = [];
      l.sents.forEach((s, i) => { if (s.p || !ps.length) ps.push([]); ps[ps.length - 1].push(`<span class="rs${S.bm['r|' + l.no + '-' + i] ? ' bm' : ''}" data-rs="${l.no}-${i}">${SND ? `<i class="sp">${SPK}</i>` : ''}<span class="e">${s.en}</span>${ko ? `<small>${s.ko}</small>` : ' '}</span>`); });
      return `<div class="lh" id="L${l.no}"><i>${l.no}</i><div><b>${l.title}</b><span>${l.ko}</span></div>${SND ? `<button class="tg pl" data-play="${l.no}">${SPK}전체 듣기</button>` : ''}</div><div class="rd${ko ? ' ko' : ''}">${ps.map(p => `<p>${p.join('')}</p>`).join('')}</div>`;
    }).join('');
    app.innerHTML = `<div class="rc"><button class="tg${ko ? ' on' : ''}" data-rko="1">해석 함께 보기</button>${SND ? `<button class="tg" data-rate="1">속도 · ${(RATES[S.rate || 0] || RATES[0])[1]}</button>` : ''}</div><p class="rn">${SND ? '스피커가 붙은 문장을 누르면 소리로 듣고 ' : '문장을 누르면 '}해석을 볼 수 있어요.${SND ? '' : ' 소리는 크롬이나 사파리로 열면 들을 수 있어요.'}</p>${body}`;
    dock.hidden = true;
  }
  function readAt(b, l, i, all) {
    const L = b.lessons.find(x => x.no === l), s = L && L.sents[i];
    app.querySelectorAll('.rs.on').forEach(e => e.classList.remove('on'));
    if (!s) { dock.hidden = true; return; }
    const el = app.querySelector(`[data-rs="${l}-${i}"]`); el.classList.add('on');
    if (all) el.scrollIntoView({ block: 'center' });
    const draw = on => { dock.hidden = false; dock.firstElementChild.innerHTML = `<div class="pg tr"><b>${s.no}</b>${s.ko}</div><button class="btn ghost bmb${S.bm['r|' + l + '-' + i] ? ' on' : ''}" data-bm="r|${l}-${i}" aria-pressed="${S.bm['r|' + l + '-' + i] ? 'true' : 'false'}" aria-label="책갈피">${bmSvg(!!S.bm['r|' + l + '-' + i])}</button><button class="btn ghost" data-act="rstop">${on ? '멈춤' : '닫기'}</button>`; };
    draw(SND);
    say(el.querySelector('.e').textContent, () => { if (all) readAt(b, l, i + 1, true); else draw(false); }, s.a);
  }

  function vocab(b) {
    const m = S.wm || 0, f = !!S.wf;
    const body = b.lessons.map(l => {
      const rows = l.words.map((w, i) => [w, `${l.no}-${i}`]).filter(x => !f || S.w[x[1]]).map(([w, k]) => `<div class="wd${S.w[k] ? ' st' : ''}" data-w="${k}"><button class="sb" data-star="${k}" aria-label="${w.en} 별표" aria-pressed="${S.w[k] ? 'true' : 'false'}">★</button><div class="we">${w.en}</div><div class="wk">${w.ko}</div>${SND ? `<button class="sy" data-say="${k}" aria-label="${w.en} 발음 듣기">${SPK}</button>` : ''}</div>`).join('');
      return `<div class="lh" id="L${l.no}"><i>${l.no}</i><div><b>${l.title}</b><span>${l.words.length}단어</span></div></div><div class="wl m${m}">${rows || '<div class="wn">★ 표시한 단어가 아직 없어요.</div>'}</div>`;
    }).join('');
    app.innerHTML = `<div class="rc">${['모두 보기', '뜻 가리기', '영어 가리기'].map((t, i) => `<button class="tg${m === i ? ' on' : ''}" data-wm="${i}">${t}</button>`).join('')}<button class="tg${f ? ' on' : ''}" data-wf="1">★ 표시만</button></div><p class="rn">가린 칸은 누르면 보여요. 헷갈리는 단어는 ★ 를 눌러 모아 두세요.</p>${body}`;
    dock.hidden = true;
  }

  let confirmReset = false;
  function drawDock(b) {
    const A = S.a[b.id] || {}, n = Object.keys(A).length, N = mc(b).length, graded = !!S.graded[b.id];
    dock.hidden = false;
    dock.firstElementChild.innerHTML = graded
      ? `<div class="pg"><b>${score(b)} / ${b.total}점</b><div>틀린 문항의 해설을 읽어 보세요</div></div>${confirmReset ? `<button class="btn ghost" data-act="cancel">취소</button><button class="btn warn" data-act="reset">답 지우기</button>` : `<button class="btn ghost" data-act="ask">다시 풀기</button>`}`
      : `<div class="pg"><b>${n} / ${N}</b> 답함<div class="meter"><i style="width:${N ? n / N * 100 : 0}%"></i></div></div><button class="btn" data-act="grade">채점하기</button>`;
  }

  function route() {
    const id = (location.hash || '#home').slice(1), b = book(id);
    confirmReset = false; hush();
    if (!b) { home(); window.scrollTo(0, 0); return; }
    const c = b.color;
    document.documentElement.style.setProperty('--bk', c);
    document.documentElement.style.setProperty('--bk-ink', '#fff');
    back.hidden = false; ttl.innerHTML = `${b.title} <small>${b.kind === 'exam' ? b.desc.split(' · ').slice(0, 2).join(' · ') : META.lessons}</small>`;
    ({ concept: grammar, read: reading, vocab: vocab }[b.kind] || exam)(b);
    window.scrollTo(0, 0);
    arrive();
  }

  const go = id => { if (location.hash === '#' + id) route(); else location.hash = id; };
  back.addEventListener('click', () => go('home'));
  window.addEventListener('hashchange', route);

  let lecUrl = '';
  async function openLec(i) {
    const L = (META.lectures || [])[i], box = $('#lec'), msg = $('#lecmsg'), fr = $('#lecfr');
    if (!L) return;
    box.hidden = false; fr.hidden = true; msg.hidden = false; msg.textContent = '수업을 불러오는 중이에요… (처음 한 번은 조금 걸려요)'; $('#lectt').textContent = L.title;
    try {
      if (!window.__lk) throw new Error('key');
      const r = await fetch(L.file); if (!r.ok) throw new Error('fetch');
      const u = new Uint8Array(await r.arrayBuffer());
      const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, window.__lk, u.slice(12));
      if (lecUrl) URL.revokeObjectURL(lecUrl);
      lecUrl = URL.createObjectURL(new Blob([pt], { type: 'text/html' }));
      fr.src = lecUrl; fr.hidden = false; msg.hidden = true;
    } catch (_) { msg.textContent = '수업을 열지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요. 계속 안 되면 앱을 닫았다 다시 열어 주세요.'; }
  }
  $('#lecx').addEventListener('click', () => { const fr = $('#lecfr'); fr.src = 'about:blank'; $('#lec').hidden = true; if (lecUrl) { URL.revokeObjectURL(lecUrl); lecUrl = ''; } });

  app.addEventListener('click', ev => {
    const t = ev.target.closest('[data-lec],[data-bm],[data-bgo],[data-bdel],[data-go],[data-g],[data-q],[data-ko],[data-allko],[data-model],[data-jump],[data-jq],[data-rko],[data-rate],[data-play],[data-rs],[data-wm],[data-wf],[data-star],[data-say],[data-w]');
    if (!t) return;
    const id = (location.hash || '#home').slice(1), b = book(id);
    if (t.dataset.lec) return openLec(+t.dataset.lec);
    if (t.dataset.go) return go(t.dataset.go);
    if (t.dataset.bm) { ev.preventDefault(); return toggleBm(t.dataset.bm); }
    if (t.dataset.bgo) return jump(t.dataset.bgo);
    if (t.dataset.bdel) { delete S.bm[t.dataset.bdel]; save(); return home(); }
    if (t.dataset.jump) { ev.preventDefault(); const el = document.getElementById(t.dataset.jump); if (el) { if (el.tagName === 'DETAILS') el.open = true; el.scrollIntoView({ block: 'start' }); window.scrollBy(0, -64); } return; }
    if (t.dataset.jq) { ev.preventDefault(); const el = document.getElementById('q' + t.dataset.jq); if (el) el.scrollIntoView({ block: 'start' }); return; }
    if (t.dataset.g) {
      const k = t.dataset.g; if (S.g[k] !== undefined) return;
      S.g[k] = +t.dataset.i; save();
      const [l, ci, ii] = k.split('-'), L = G.lessons.find(x => x.no === l), c = L.concepts[+ci];
      const el = document.getElementById('pi-' + k); el.outerHTML = practice(l, +ci, +ii, c.items[+ii]);
      const d = document.querySelector(`details[data-d="c-${l}-${ci}"] summary u`);
      if (d) d.textContent = `${c.items.filter((_, i) => S.g[`${l}-${ci}-${i}`] !== undefined).length} / ${c.items.length}`;
      return;
    }
    if (t.dataset.ko) { S.ko[t.dataset.ko] = 1; save(); const l = t.dataset.ko.split('-')[0], no = t.dataset.ko.slice(l.length + 1); const s = G.lessons.find(x => x.no === l).reading.sents.find(x => x.no === no); t.outerHTML = `<div class="ko">${s.ko}</div>`; return; }
    if (t.dataset.allko) { const k = 'all-' + t.dataset.allko; S.ko[k] = S.ko[k] ? 0 : 1; S.show['r-' + t.dataset.allko] = 1; save(); const y = window.scrollY; grammar(G); window.scrollTo(0, y); return; }
    if (b && b.kind === 'read') {
      const y = window.scrollY, d = t.dataset;
      if (d.rko) { hush(); S.rko = S.rko ? 0 : 1; save(); reading(b); window.scrollTo(0, y); }
      else if (d.rate) { hush(); S.rate = ((S.rate || 0) + 1) % RATES.length; save(); reading(b); window.scrollTo(0, y); }
      else if (d.play) readAt(b, d.play, 0, true);
      else if (d.rs) { const k = d.rs, c = k.lastIndexOf('-'); readAt(b, k.slice(0, c), +k.slice(c + 1), false); }
      return;
    }
    if (b && b.kind === 'vocab') {
      const y = window.scrollY, d = t.dataset;
      if (d.wm) { S.wm = +d.wm; save(); vocab(b); window.scrollTo(0, y); }
      else if (d.wf) { S.wf = S.wf ? 0 : 1; save(); vocab(b); window.scrollTo(0, y); }
      else if (d.star) { const k = d.star; if (S.w[k]) delete S.w[k]; else S.w[k] = 1; save(); if (S.wf) { vocab(b); window.scrollTo(0, y); } else { const r = t.closest('.wd'); r.classList.toggle('st', !!S.w[k]); t.setAttribute('aria-pressed', S.w[k] ? 'true' : 'false'); } }
      else if (d.say) { const c = d.say.lastIndexOf('-'), w = b.lessons.find(x => x.no === d.say.slice(0, c)).words[+d.say.slice(c + 1)]; say(t.closest('.wd').querySelector('.we').textContent, null, w.a); }
      else if (d.w) t.classList.toggle('rv');
      return;
    }
    if (!b || b.kind !== 'exam') return;
    if (t.dataset.model) { S.show[`${b.id}-${t.dataset.model}`] = 1; save(); const y = window.scrollY; exam(b); window.scrollTo(0, y); return; }
    if (t.dataset.q && !S.graded[b.id]) {
      const no = +t.dataset.q, i = +t.dataset.i;
      S.a[b.id] = S.a[b.id] || {};
      if (S.a[b.id][no] === i) delete S.a[b.id][no]; else S.a[b.id][no] = i;
      save();
      t.parentElement.querySelectorAll('.ch').forEach((el, k) => el.classList.toggle('sel', S.a[b.id][no] === k));
      drawDock(b);
    }
  });
  app.addEventListener('toggle', ev => { const d = ev.target; if (d.dataset && d.dataset.d) { S.show[d.dataset.d] = d.open ? 1 : 0; save(); } }, true);
  app.addEventListener('input', ev => {
    const t = ev.target; if (!t.dataset || !t.dataset.es) return;
    const id = (location.hash || '#home').slice(1); S.e[id] = S.e[id] || {}; S.e[id][t.dataset.es] = t.value; save();
  });
  dock.addEventListener('click', ev => {
    const bt = ev.target.closest('[data-bm]'); if (bt) { toggleBm(bt.dataset.bm); return; }
    const t = ev.target.closest('[data-act]'); if (!t) return;
    const b = book((location.hash || '#home').slice(1)); if (!b) return;
    const act = t.dataset.act;
    if (act === 'rstop') { hush(); app.querySelectorAll('.rs.on').forEach(e => e.classList.remove('on')); dock.hidden = true; return; }
    if (act === 'grade') { S.graded[b.id] = 1; save(); exam(b); window.scrollTo(0, 0); }
    else if (act === 'ask') { confirmReset = true; drawDock(b); }
    else if (act === 'cancel') { confirmReset = false; drawDock(b); }
    else if (act === 'reset') { confirmReset = false; delete S.a[b.id]; delete S.e[b.id]; delete S.graded[b.id]; Object.keys(S.show).forEach(k => { if (k.startsWith(b.id + '-')) delete S.show[k]; }); save(); exam(b); window.scrollTo(0, 0); }
  });
  if (G.lessons.length) { const k0 = 'c-' + G.lessons[0].no + '-0'; if (S.show[k0] === undefined) S.show[k0] = 1; }
  route();
}

  if (!ENC) { startApp(null); return; }
  const lock = document.getElementById('lock'), form = document.getElementById('lockform'), inp = document.getElementById('lockcode'), msg = document.getElementById('lockmsg');
  const KK = 'tbkey-' + META.slug;
  const b64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
  const loadYt = async key => { window.__yt = {}; if (!META.ytfile) return; try { const r = await fetch(META.ytfile); if (!r.ok) return; const u = new Uint8Array(await r.arrayBuffer()); window.__yt = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(0, 12) }, key, u.slice(12)))); } catch (_) {} };
  const open = async key => JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(ENC.iv) }, key, b64(ENC.ct))));
  const begin = data => { lock.hidden = true; document.querySelector('.bar').hidden = false; startApp(data); };
  const show = () => { document.querySelector('.bar').hidden = true; lock.hidden = false; document.getElementById('locktitle').textContent = `${META.grade} 영어 ${META.lessons} ${META.term}`; document.getElementById('lockacad').textContent = META.academy || ''; };
  (async () => {
    if (!(window.crypto && crypto.subtle)) { show(); msg.textContent = '이 브라우저에서는 열 수 없어요. 크롬이나 사파리로 열어 주세요.'; return; }
    try {                                           // 전에 연 폰은 다시 묻지 않는다
      const saved = localStorage.getItem(KK);
      if (saved) { const key = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']); window.__lk = key; await loadYt(key); begin(await open(key)); return; }
    } catch (_) { try { localStorage.removeItem(KK); } catch (_) {} }
    show();
  })();
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const code = inp.value.trim(); if (!code) return;
    msg.textContent = '확인하는 중…';
    try {
      const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(ENC.salt), iterations: ENC.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
